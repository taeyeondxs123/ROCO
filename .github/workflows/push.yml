name: 洛克王国远行商人推送

on:
  schedule:
    - cron: '0 0,4,8,12 * * *'
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: 获取商人信息
        id: check
        run: |
          # 新的备用API接口
          response=$(curl -s "https://roco-api.vercel.app/api/merchant")
          echo "response=$response" >> $GITHUB_OUTPUT

      - name: 发送Bark推送
        run: |
          goods=$(echo '${{ steps.check.outputs.response }}' | jq -r '
            if .status == "success" and (.data.goods | length > 0) then
              "本次刷新商品：\n" + (.data.goods | map("- \(.name) x\(.count)") | join("\n"))
            elif .status == "success" then
              "本次刷新：无稀有商品"
            else
              "API请求失败，接口返回错误"
            end
          ')
          curl -s "https://api.day.app/${{ secrets.BARK_KEY }}/商人已刷新/$goods"
