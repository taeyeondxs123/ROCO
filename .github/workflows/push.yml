name: 洛克王国远行商人推送
on:
  schedule:
    # 北京时间 8:00 / 12:00 / 16:00 / 20:00 自动运行
    - cron: '0 0,4,8,12 * * *'
  workflow_dispatch: # 允许手动点击运行测试

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: 检查商人刷新
        id: check
        run: |
          response=$(curl -s -H "Authorization: Bearer sk-ba042e079cf9ccb30e72b3d5af458f45" https://wegame.shallow.ink/api/roco/merchant)
          echo "response=$response" >> $GITHUB_OUTPUT

      - name: 发送Bark推送
        if: ${{ fromJson(steps.check.outputs.response).status == 'success' && fromJson(steps.check.outputs.response).data.goods != null }}
        run: |
          goods=$(echo '${{ steps.check.outputs.response }}' | jq -r '.data.goods | map("- \(.name) x\(.count)") | join("\n")')
          curl -s "https://api.day.app/${{ secrets.BARK_KEY }}/远行商人刷新啦!/$goods?icon=https://ghproxy.net/https://raw.githubusercontent.com/JayeGT002/RocoM-Webhook-Push/main/logo.png"
