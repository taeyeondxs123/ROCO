name: 洛克王国远行商人推送

on:
  schedule:
    - cron: '0 0,4,8,12 * * *'
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: 获取商人信息
        id: check
        run: |
          res=$(curl -s "https://wegame.shallow.ink/api/roco/merchant" \
            -H "Authorization: Bearer sk-ba042e079cf9ccb30e72b3d5af458f45")
          echo "response=$res" >> $GITHUB_OUTPUT

      - name: 推送 Bark 通知
        run: |
          goods=$(echo '${{ steps.check.outputs.response }}' | jq -r '
            if .data.goods == null or .data.goods | length == 0 then
              "本次刷新：无商品"
            else
              .data.goods | map("- \(.name) x\(.count)") | join("\n")
            end
          ')
          curl -s "https://api.day.app/${{ secrets.BARK_KEY }}/商人已刷新/$goods"
