name: 洛克王国远行商人推送

on:
  schedule:
    - cron: '0 0,4,8,12 * * *'
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: 获取商人信息
        id: check
        run: |
          res=$(curl -s -w "%{http_code}" -o response.json "https://wegame.shallow.ink/api/roco/merchant" \
            -H "Authorization: Bearer sk-ba042e079cf9ccb30e72b3d5af458f45")
          echo "status_code=$res" >> $GITHUB_OUTPUT

      - name: 推送 Bark 通知
        run: |
          if [ "${{ steps.check.outputs.status_code }}" -eq 200 ]; then
            goods=$(cat response.json | jq -r '
              if .data.goods == null or .data.goods | length == 0 then
                "本次刷新：无商品"
              else
                .data.goods | map("- \(.name) x\(.count)") | join("\n")
              end
            ')
          else
            goods="API请求失败，状态码：${{ steps.check.outputs.status_code }}"
          fi
          curl -s "https://api.day.app/${{ secrets.BARK_KEY }}/商人已刷新/$goods"
